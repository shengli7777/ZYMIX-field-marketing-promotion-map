<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>ZYMIX 地推点位工作台</title>
    <meta name="description" content="用地图筛选地推点位并记录活动反馈。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307c160'/%3E%3Cpath d='M16 5a8 8 0 0 0-8 8c0 6 8 14 8 14s8-8 8-14a8 8 0 0 0-8-8' fill='white'/%3E%3Ccircle cx='16' cy='13' r='3' fill='%2307c160'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo">Z</span>
        <div><strong>ZYMIX</strong><span>地推点位工作台</span></div>
      </div>
      <div class="header-right">
        <button id="refreshDataBtn" hidden>刷新数据</button><button id="loginBtn">登录工作台</button><span id="cloudStatus" class="demo">公开演示</span
        ><button id="helpBtn" class="quiet">查看工作流</button
        ><button id="addBtn" class="primary">新增点位</button>
      </div>
    </header>
    <main>
      <aside class="locations">
        <div class="section-head">
          <h1>选择下一次试推点位</h1>
          <p>比较候选地点，查看周边资料和活动反馈。</p>
        </div>
        <label class="search-label"
          ><span class="sr">搜索点位</span><input id="search" placeholder="搜索点位或类型" /></label
        ><label class="view-label" hidden
          >查看内容<select id="viewFilter">
            <option value="">全部点位</option>
            <option value="candidate">团队活动区域</option>
            <option value="demo">活动演示点位</option>
          </select></label
        >
        <label>场地类型<select id="typeFilter">
          <option value="">全部类型</option>
          <option>校园周边</option><option>交通站点周边</option>
          <option>商圈／商业街</option><option>餐饮店周边</option>
          <option>公园／广场</option><option>学生公寓周边</option>
          <option>其他</option><option>待确认</option>
        </select></label>
        <div class="filters">
          <label
            >点位状态<select id="statusFilter">
              <option value="">全部状态</option>
              <option>候选</option>
              <option>可试推</option>
              <option>已反馈</option>
              <option>暂停</option>
            </select></label
          ><label
            >环境类型<select id="indoorFilter">
              <option value="">全部环境</option>
              <option>室内</option>
              <option>室外</option>
            <option>室内外混合</option><option>待确认</option></select></label
          >
        </div>
        <div class="list-top"><span id="count"></span><span>候选与活动</span></div>
        <details id="presencePanel" hidden><summary>团队最近活跃</summary><div id="presenceList"></div><small id="presenceChecked"></small></details><small id="syncTime"></small>
        <div id="pointList" class="point-list"></div>
        <p class="footnote">未登录时显示模拟活动；登录后只显示团队保存的地点。</p>
      </aside>
      <section class="map-area">
        <div class="map-bar">
          <span><strong>伦敦</strong><small>点位分布</small></span
          ><button id="resetMap" class="quiet">回到总览</button>
        </div>
        <div id="map" tabindex="0" aria-label="伦敦点位地图，可拖动或使用方向键，使用加减按钮缩放">
          <div id="tiles"></div>
          <div id="markers"></div>
          <div id="mapMessage" class="map-message" hidden></div>
          <div class="zoom">
            <button id="zoomIn" aria-label="放大地图">＋</button
            ><button id="zoomOut" aria-label="缩小地图">−</button>
          </div>
          <div class="attribution">
            ©
            <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"
              >OpenStreetMap</a
            >
            contributors
          </div>
        </div>
        <div class="legend">
          <span><i class="dot candidate"></i>候选</span><span><i class="dot ready"></i>可试推</span
          ><span><i class="dot done"></i>已反馈</span
          ><span><i class="dot paused"></i>暂停</span>
        </div>
      </section>
      <aside id="detail" class="detail" aria-live="polite"></aside>
    </main>
    <div class="bottom-note">公开演示：修改仅本次有效。登录后地点、评分、场地状态与反馈保存到云端。</div>
    <dialog id="modal">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="closeModal" aria-label="关闭窗口" class="quiet">✕</button>
      </div>
      <div id="modalBody"></div>
    </dialog>
    <div id="toast" role="status"></div>
    <script src="app.js"></script>
    <script src="cloud.js"></script>
    <script src="screening.js"></script>
  </body>
</html>
